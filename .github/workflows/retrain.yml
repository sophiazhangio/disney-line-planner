name: retrain-model

on:
  schedule:
    - cron: "17 12 * * 1"   # Mondays 12:17 UTC (early morning in California)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Train and evaluate
        run: python -m dlp.model
      - name: Update README results
        run: python scripts/update_readme.py
      - name: Commit results
        run: |
          git config user.name "wait-time-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -d results ]; then git add results; fi
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -q -m "docs(results): weekly model retrain $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep 10
          done
          exit 1
